[package]
name = "midge-destroyer"
version = "0.1.0"
edition = "2021"
description = "Midge durability and recovery destroyer harness"
license = "Apache-2.0"
authors = ["cntryl" ]
publish = false

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
rand = { version = "0.10", features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
fail = { version = "0.5", optional = true }
thiserror = "1.0"
cntryl-midge = { path = "../midge" }

[features]
default = []
failpoint-tier = ["cntryl-midge/failpoints", "fail"]

[[bin]]
name = "midge-destroyer"
path = "src/main.rs"

[[bin]]
name = "midge-destroyer-worker"
path = "src/bin/worker.rs"

[dev-dependencies]
tempfile = "3.15"
