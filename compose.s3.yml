services:
  sqrzl:
    image: ghcr.io/sqrzl/sqrzl-emulator@sha256:876e017f850e53f3f4172cae459982cfe9435584fcb8e4640120b2e5fabfc624
    hostname: sqrzl
    user: ${SQRZL_CONTAINER_USER:?set SQRZL_CONTAINER_USER}
    environment:
      SQRZL_BLOBS_PATH: /app/blobs
      SQRZL_ACCESS_KEY_ID: admin
      SQRZL_SECRET_ACCESS_KEY: easy-peasy
      SQRZL_BUCKET_LIST: midge-destroyer
    ports:
      - "127.0.0.1::9000"
      - "127.0.0.1::9001"
    volumes:
      - type: bind
        source: ${SQRZL_BLOBS_HOST_PATH:?set SQRZL_BLOBS_HOST_PATH}
        target: /app/blobs
